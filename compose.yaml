# TP3

services:

  
  # TRAEFIK
  
  proxy:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    networks:
      - cloud
    command:
      - '--log.level=DEBUG'
      - '--api.insecure=true'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'
      - '--certificatesresolvers.letsencrypt.acme.dnschallenge=true'
      - '--certificatesresolvers.letsencrypt.acme.dnschallenge.provider=duckdns'
      - '--certificatesresolvers.letsencrypt.acme.email=${MY_EMAIL}'
      - '--certificatesresolvers.letsencrypt.acme.dnschallenge.disablePropagationCheck=true'
      - '--certificatesresolvers.letsencrypt.acme.dnschallenge.resolvers=1.1.1.1:53,8.8.8.8:53'
      - '--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json'
      - '--entrypoints.web.address=:80'
      - '--entrypoints.web.http.redirections.entrypoint.to=websecure'
      - '--entrypoints.web.http.redirections.entrypoint.scheme=https'
      - '--entrypoints.websecure.address=:443'
      - '--entrypoints.websecure.http.tls=true'
      - '--entrypoints.websecure.http.tls.certResolver=letsencrypt'
      - '--entrypoints.websecure.http.tls.domains[0].main=${MY_DOMAIN}'
      - '--entrypoints.websecure.http.tls.domains[0].sans=*.${MY_DOMAIN}'
    volumes:
      - ./data/traefik/letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.api.rule=Host(`${MY_DOMAIN}`)'
      - 'traefik.http.routers.api.entryPoints=websecure'
      - 'traefik.http.routers.api.service=api@internal'
    ports:
      - '80:80'
      - '443:443'
    environment:
      - 'DUCKDNS_TOKEN=${DUCKDNS_TOKEN}'

  
  # PORTAINER
  
  portainer:
    image: portainer/portainer-ce:alpine
    container_name: portainer
    restart: unless-stopped
    networks:
      - cloud
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.portainer.rule=Host(`portainer.${MY_DOMAIN}`)'
      - 'traefik.http.routers.portainer.entryPoints=websecure'
      - 'traefik.http.services.portainer.loadbalancer.server.port=9000'
      - 'traefik.http.routers.portainer.service=portainer'

  
  # NEXTCLOUD DB
  
  nextclouddb:
    image: mysql:8.0
    container_name: nextcloud-db
    restart: unless-stopped
    command: --transaction-isolation=READ-COMMITTED --binlog-format=ROW
    networks:
      - cloud
    volumes:
      - nextclouddb:/var/lib/mysql
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Montreal
      - MYSQL_RANDOM_ROOT_PASSWORD=true
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USER}

  
  # NEXTCLOUD
  
  nextcloud:
    image: nextcloud
    container_name: nextcloud
    restart: unless-stopped
    networks:
      - cloud
    depends_on:
      - nextclouddb
    volumes:
      - ./nextcloud/html:/var/www/html
      - ./nextcloud/custom_apps:/var/www/html/custom_apps
      - ./nextcloud/config:/var/www/html/config
      - ./nextcloud/data:/var/www/html/data
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Montreal
      - MYSQL_PASSWORD=${DB_PASSWORD}
      - MYSQL_DATABASE=${DB_DATABASE}
      - MYSQL_USER=${DB_USER}
      - MYSQL_HOST=nextclouddb
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.nextcloud.rule=Host(`nextcloud.${MY_DOMAIN}`)'
      - 'traefik.http.routers.nextcloud.entryPoints=websecure'

  
  # JELLYFIN
  
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    networks:
      - cloud
    environment:
      - TZ=America/Montreal
    volumes:
      - jellyfin_data:/config
      - /mnt/media/Movies:/movies
      - /mnt/media/TV:/tv
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.jellyfin.rule=Host(`jellyfin.${MY_DOMAIN}`)'
      - 'traefik.http.routers.jellyfin.entryPoints=websecure'

  
  # BLOGVERSE DB
  
  blogverse-db:
    image: mysql:8.0
    container_name: blogverse-db
    restart: unless-stopped
    networks:
      - cloud
    volumes:
      - blogverse_db_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  
  # BLOGVERSE BACKEND
  
  blogverse-backend:
    image: diegofanara/tp2-2262164-blogverse-backend:${BACKEND_VERSION:-latest}
    container_name: blogverse-backend
    hostname: backend
    restart: unless-stopped
    networks:
      - cloud
    environment:
      - DB_HOST=blogverse-db
      - DB_PORT=3306
      - DB_NAME=${MYSQL_DATABASE}
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-7d}
    depends_on:
      blogverse-db:
        condition: service_healthy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.blogverse-api.rule=Host(`blogverse.${MY_DOMAIN}`) && PathPrefix(`/api`)'
      - 'traefik.http.routers.blogverse-api.entryPoints=websecure'
      - 'traefik.http.routers.blogverse-api.priority=10'
      - 'traefik.http.services.blogverse-api.loadbalancer.server.port=3000'
      - 'traefik.http.routers.blogverse-api.service=blogverse-api'

  
  # BLOGVERSE FRONTEND
  
  blogverse-frontend:
    image: diegofanara/tp2-2262164-blogverse-frontend:${FRONTEND_VERSION:-latest}
    container_name: blogverse-frontend
    restart: unless-stopped
    networks:
      - cloud
    depends_on:
      - blogverse-backend
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.blogverse.rule=Host(`blogverse.${MY_DOMAIN}`)'
      - 'traefik.http.routers.blogverse.entryPoints=websecure'
      - 'traefik.http.services.blogverse.loadbalancer.server.port=80'
      - 'traefik.http.routers.blogverse.service=blogverse'


# VOLUMES

volumes:
  portainer_data:
  nextclouddb:
  jellyfin_data:
  blogverse_db_data:


# RÉSEAU

networks:
  cloud:
    driver: bridge
